name: Deploy frontend to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          # Key auth is preferred and wins when both are set; VPS_PASSWORD is
          # the fallback for hosts that only have password login configured.
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd ~/campus_tracker/location_app
            git pull origin main
            cd ~/campus_tracker
            # --no-deps: the frontend service declares depends_on: backend, so
            # without it compose rebuilds and recreates the backend container
            # too. That collides with the backend repo's own deploy workflow and
            # leaves an orphaned container holding the name.
            docker compose up --build -d --no-deps frontend
            docker image prune -f
